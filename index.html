<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s Eat!</title>
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    color-scheme: dark;

    /* Design tokens */
    --page-color: #111111;
    --theme-color: #ff591f;
    --button-color: var(--theme-color);
    --card-color: #262626;
    --button-radius: 12px;
    --card-radius: var(--button-radius);
    --content-width: min(340px, calc(100vw - 32px)); /* button and card share this */
    --lift: 6vh; /* raises button and card above true center */

    /* Derived */
    --text-color: #eeeeee;
    --text-muted: #a3a3a3;
    --button-text-color: white;
    --menu-color: color-mix(in srgb, var(--card-color), white 10%);
  }

  html, body { margin: 0; height: 100%; background: var(--page-color); color: var(--text-color);
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { position: relative; height: 100%; }

  /* Button is pinned just above center (by --lift); the card hangs below it so the button never moves. */
  #eat { position: absolute; left: 50%; top: calc(50% - var(--lift)); transform: translate(-50%, -50%);
    width: var(--content-width); box-sizing: border-box;
    font: inherit; font-size: 22px; font-weight: 500; padding: 16px 20px; border: 0;
    border-radius: var(--button-radius); background: var(--button-color);
    color: var(--button-text-color); cursor: pointer; white-space: nowrap; }
  #eat:active { transform: translate(-50%, -50%) scale(0.97); }

  #result { position: absolute; left: 50%; top: calc(50% - var(--lift) + 52px); transform: translateX(-50%);
    width: var(--content-width); }

  /* The card is a container; its link stretches over the whole card (::after),
     and the kebab sits above that so it stays separately clickable. */
  .card { position: relative; padding: 32px 20px; border-radius: var(--card-radius);
    background: var(--card-color); color: var(--text-muted);
    text-align: center; line-height: 1.5; font-size: 15px; }
  .card:hover { background: color-mix(in srgb, var(--card-color), white 6%); }
  .card:has(.card-link:focus-visible) { outline: 2px solid var(--theme-color); outline-offset: 2px; }
  .card-link { color: inherit; text-decoration: none; outline: none; }
  .card-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .card .name { display: block; margin-bottom: 4px; color: var(--text-color);
    font-size: 20px; font-weight: 500; }

  /* Small icon buttons: the card’s ⋯, the page’s ⋮, the modal’s ×. */
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0;
    border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer; }
  .icon-btn:hover, .icon-btn:focus-visible { background: color-mix(in srgb, var(--card-color), white 12%);
    color: var(--text-color); outline: none; }
  .card .icon-btn { position: absolute; top: 4px; right: 4px; z-index: 1; }
  /* Page menu: fixed top-right, clear of the notch / home indicator when installed. */
  #page-kebab { position: fixed; z-index: 1;
    top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }

  /* Native popovers; positioned under their trigger in JS when they open. */
  .menu { position: fixed; inset: auto; margin: 0; padding: 4px; border: 0;
    border-radius: var(--button-radius); background: var(--menu-color); color: var(--text-color);
    box-shadow: 0 8px 24px rgb(0 0 0 / 0.4); }
  .menu button { display: block; width: 100%; padding: 10px 14px; border: 0;
    border-radius: calc(var(--button-radius) - 4px); background: transparent;
    color: inherit; font: inherit; font-size: 15px; text-align: left; cursor: pointer; white-space: nowrap; }
  .menu button:hover, .menu button:focus-visible
    { background: color-mix(in srgb, var(--menu-color), white 8%); outline: none; }

  /* Stats modal: a native <dialog> (focus, Escape, screen readers) restyled to match the card. */
  #stats { width: var(--content-width); box-sizing: border-box; margin: auto; padding: 8px 20px 18px;
    border: 0; border-radius: var(--card-radius); background: var(--card-color); color: var(--text-color);
    font: inherit; box-shadow: 0 12px 32px rgb(0 0 0 / 0.3); }
  #stats::backdrop { background: rgb(0 0 0 / 0.45); }
  #stats[open], #stats[open]::backdrop { animation: fade-in 140ms ease-out; }
  @keyframes fade-in { from { opacity: 0; } }
  #stats header { display: flex; align-items: center; justify-content: space-between;
    margin: 0 -12px 6px 0; }
  #stats h2 { margin: 0; font-size: 17px; font-weight: 500; outline: none; }
  #stats dl { margin: 0; font-size: 15px; line-height: 1.5; }
  #stats .row { display: flex; gap: 10px; padding: 3px 0; }
  #stats dt { order: 2; color: var(--text-muted); }
  #stats dd { order: 1; margin: 0; min-width: 3.5em; font-weight: 500; font-variant-numeric: tabular-nums; }

  .note { margin: 12px 0 0; text-align: center; font-size: 13px; color: var(--text-muted); }
  .note button { padding: 0; border: 0; background: none; font: inherit;
    color: var(--text-color); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <button id="eat" type="button">Let’s Eat!</button>
  <div id="result" aria-live="polite"></div>
</main>

<button type="button" id="page-kebab" class="icon-btn" aria-label="Menu" popovertarget="page-menu">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
</button>
<div id="page-menu" class="menu" popover>
  <button type="button" id="show-stats">Show stats</button>
  <button type="button" id="reset-seen">Reset viewed list</button>
  <button type="button" id="reset-excluded">Reset exclude list</button>
</div>
<div id="card-menu" class="menu" popover>
  <button type="button" id="exclude">Exclude this entry</button>
</div>

<dialog id="stats" aria-labelledby="stats-title">
  <header>
    <h2 id="stats-title" tabindex="-1" autofocus>Stats</h2>
    <button type="button" class="icon-btn" id="close-stats" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <dl>
    <div class="row"><dt>restaurants</dt><dd id="stat-total">…</dd></div>
    <div class="row"><dt>excluded</dt><dd id="stat-excluded">…</dd></div>
    <div class="row"><dt>in rotation</dt><dd id="stat-active">…</dd></div>
    <div class="row"><dt>seen this session</dt><dd id="stat-seen">…</dd></div>
  </dl>
</dialog>

<script>
// Canonical list (see NOTES.md): open SF Business Registry locations, geocoded inside
// SF city limits, holding a DPH restaurant permit (H24/H25/H26).
const QUERY = "https://data.sf.gov/resource/g8m3-pdis.json?" + new URLSearchParams({
  $select: "ttxid,dba_name,full_business_address,lic,neighborhoods_analysis_boundaries",
  $where: "location_end_date IS NULL AND dba_end_date IS NULL" +
          " AND neighborhoods_analysis_boundaries IS NOT NULL" +
          " AND (lic like '%H24%' OR lic like '%H25%' OR lic like '%H26%')",
  $limit: "10000",
});

// Places that hold a restaurant permit but aren't somewhere the public goes to eat.
const MARKET_PERMIT = /\bH0[3-9]R?\b|\bH8[0-3]R?\b/;              // also a grocery/supermarket
const CONTRACT_CAFE = /@|\b(sodexo|aramark|guckenheimer|levy restaurants|events mgmt|employee)\b/i;
const ADDRESS_AS_NAME = /^\d+\s.*\b(llc|inc|corp|corporation|lp|ltd)\b/i;

function cleanName(name) {
  let n = name.trim().replace(/\s+/g, " ");
  // "Boichik Bagels LLC" -> "Boichik Bagels" (repeat for "… Co., Inc.")
  const suffix = /[,\s]+(llc|l\.l\.c\.?|inc\.?|corp\.?|corporation|ltd\.?|lp)$/i;
  while (suffix.test(n)) n = n.replace(suffix, "");
  // "Ritz Carlton San Francisco The" -> "The Ritz Carlton San Francisco"
  if (/\sthe$/i.test(n)) n = "The " + n.replace(/\sthe$/i, "");
  return n;
}

// Display-only: registry names use straight quotes ("Ma's", "Grubbin'", '"Great American
// Music Hall"'). Convert them to curly punctuation. Maps search keeps the raw name.
function curly(s) {
  return s
    .replace(/`+$/, "")                                       // stray trailing backticks
    .replace(/(?<=[\p{L}\p{N}])["'`](?=[\p{L}\p{N}])/gu, "’") // Ma's, Mustafio"S
    .replace(/"([^"]*)"/g, "“$1”")                            // "quoted"
    .replace(/(^|[\s(])'(?=\d)/g, "$1’")                      // '90s
    .replace(/(^|[\s(])'/g, "$1‘")                            // opening single quote
    .replace(/['`]/g, "’")                                    // Grubbin', Gus'
    .replace(/"/g, "”");                                      // any unpaired leftover
}

// One entry per name + address. A few places are two registry rows; the entry
// keeps every row's location ID (ttxid) so excluding it covers all of them.
function buildList(rows) {
  const byKey = new Map();
  for (const r of rows) {
    const raw = r.dba_name || "";
    if (!raw || MARKET_PERMIT.test(r.lic || "") || CONTRACT_CAFE.test(raw) || ADDRESS_AS_NAME.test(raw)) continue;
    const name = cleanName(raw);
    const address = (r.full_business_address || "").trim().replace(/\s+/g, " ");
    const key = (name + "|" + address).toUpperCase().replace(/[^A-Z0-9|]/g, "");
    const existing = byKey.get(key);
    if (existing) { existing.ids.push(r.ttxid); continue; }
    byKey.set(key, { key, ids: [r.ttxid], name, address, hood: r.neighborhoods_analysis_boundaries });
  }
  return [...byKey.values()];
}

const listPromise = fetch(QUERY)
  .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
  .then(buildList);
listPromise.then(l => console.log(`Loaded ${l.length} restaurants`)).catch(() => {});

// Web storage, or an in-memory stand-in if it's unavailable (blocked, private
// mode, data: URL). Then: no repeats until reload; exclusions until reload.
function storage(kind) {
  try {
    const s = window[kind];
    s.setItem("_probe", "1");
    s.removeItem("_probe");
    return s;
  } catch {
    const m = new Map();
    return { getItem: k => m.get(k) ?? null, setItem: (k, v) => m.set(k, String(v)) };
  }
}

// No repeats until the tab closes: sessionStorage is per tab, survives reloads,
// and is cleared when the tab closes. Once every restaurant has been shown, the
// cycle restarts (skipping the one just shown so it can't appear twice in a row).
const session = storage("sessionStorage");
const SEEN = "seen", LAST = "last";
const seen = new Set(JSON.parse(session.getItem(SEEN) || "[]"));

// Exclusions are permanent on this device (localStorage), keyed by registry
// location ID. Name and address are kept so a future list can show them.
const local = storage("localStorage");
const EXCLUDED = "excluded";
const excluded = JSON.parse(local.getItem(EXCLUDED) || "{}");
const saveExcluded = () => local.setItem(EXCLUDED, JSON.stringify(excluded));
const isExcluded = p => p.ids.some(id => id in excluded);

function exclude(p) {
  const date = new Date().toLocaleDateString("en-CA"); // local YYYY-MM-DD
  for (const id of p.ids) excluded[id] = { name: p.name, address: p.address, date };
  saveExcluded();
}
function unexclude(p) {
  for (const id of p.ids) delete excluded[id];
  saveExcluded();
}
// Places, not IDs: a merged place has several IDs with the same name and address.
const excludedCount = () => new Set(Object.values(excluded).map(e => e.name + "|" + e.address)).size;
// Clears every exclusion; returns what was cleared so it can be restored.
function resetExcluded() {
  const snapshot = { ...excluded };
  for (const id in excluded) delete excluded[id];
  saveExcluded();
  return snapshot;
}
function restoreExcluded(snapshot) {
  Object.assign(excluded, snapshot);
  saveExcluded();
}

function pick(list) {
  const active = list.filter(p => !isExcluded(p));
  if (active.length === 0) return null;
  let pool = active.filter(p => !seen.has(p.key));
  if (pool.length === 0) {
    seen.clear();
    const last = session.getItem(LAST);
    pool = active.length > 1 ? active.filter(p => p.key !== last) : active;
  }
  const p = pool[Math.floor(Math.random() * pool.length)];
  seen.add(p.key);
  session.setItem(SEEN, JSON.stringify([...seen]));
  session.setItem(LAST, p.key);
  return p;
}

const btn = document.getElementById("eat");
const out = document.getElementById("result");
const cardMenu = document.getElementById("card-menu");
const pageMenu = document.getElementById("page-menu");
const statsDialog = document.getElementById("stats");
let current = null;

const el = (tag, props = {}, ...children) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
};

const ICON_MORE_H = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
  '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

function showMessage(text) {
  current = null;
  out.replaceChildren(el("div", { className: "card" }, text));
}

// Render a restaurant card, optionally with a note (and its Undo) below it.
function show(p, note) {
  current = p;
  const link = el("a", {
    className: "card-link",
    href: "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(`${p.name}, ${p.address}, San Francisco, CA`),
    target: "_blank",
    rel: "noopener",
  }, el("span", { className: "name" }, curly(p.name)), p.address, el("br"), p.hood || "");

  const more = el("button", { type: "button", className: "icon-btn", innerHTML: ICON_MORE_H });
  more.setAttribute("aria-label", "Entry options");
  more.setAttribute("popovertarget", "card-menu");

  out.replaceChildren(el("div", { className: "card" }, link, more), ...(note ? [note] : []));
}

// Show a note under the card, or on its own if no card is showing.
function notify(note) {
  if (current) show(current, note);
  else out.replaceChildren(note);
}
// Put back whatever was showing before a note appeared.
function clearNote() {
  if (current) show(current);
  else out.replaceChildren();
}

async function next() {
  let list;
  try {
    list = await listPromise;
  } catch {
    return showMessage("Couldn’t load restaurants. Reload to try again.");
  }
  const p = pick(list);
  if (!p) return showMessage("Every restaurant is excluded.");
  show(p);
  return p;
}

btn.addEventListener("click", next);

// Menus open under their trigger, right-aligned to it.
function anchorMenu(menu, trigger) {
  menu.addEventListener("toggle", e => {
    if (e.newState !== "open") return;
    const t = trigger().getBoundingClientRect();
    menu.style.top = `${t.bottom + 8}px`;
    menu.style.left = `${t.right - menu.offsetWidth}px`;
  });
}
anchorMenu(cardMenu, () => out.querySelector(".card .icon-btn"));
anchorMenu(pageMenu, () => document.getElementById("page-kebab"));

// Clicking blank space hides the card. If a menu was open, that click only
// closes the menu (popovers dismiss themselves), so remember its state first.
// The page menu, its trigger, and the modal live outside <main>, so their
// clicks never reach this handler.
let menuWasOpen = false;
document.addEventListener("pointerdown", () => {
  menuWasOpen = cardMenu.matches(":popover-open") || pageMenu.matches(":popover-open");
}, true);
document.querySelector("main").addEventListener("click", e => {
  // Use the path captured at dispatch: an Undo re-renders the card, which
  // detaches the clicked button before this handler runs.
  if (menuWasOpen || e.composedPath().some(n => n === btn || n === out)) return;
  current = null;
  out.replaceChildren();
});

document.getElementById("exclude").addEventListener("click", async () => {
  cardMenu.hidePopover();
  const gone = current;
  if (!gone) return;
  exclude(gone);
  const p = await next();
  if (!p) return;

  const undo = el("button", { type: "button" }, "Undo");
  undo.addEventListener("click", () => {
    unexclude(gone);
    show(gone);
  });
  show(p, el("p", { className: "note" }, `Excluded ${curly(gone.name)} · `, undo));
});

document.getElementById("reset-excluded").addEventListener("click", () => {
  pageMenu.hidePopover();
  const count = excludedCount();
  if (count === 0) return notify(el("p", { className: "note" }, "Nothing is excluded"));

  const snapshot = resetExcluded();
  const undo = el("button", { type: "button" }, "Undo");
  undo.addEventListener("click", () => {
    restoreExcluded(snapshot);
    clearNote();
  });
  const label = count === 1 ? "Cleared 1 exclusion · " : `Cleared ${count} exclusions · `;
  notify(el("p", { className: "note" }, label, undo));
});

// Restart the no-repeat shuffle from zero: everything is eligible again.
document.getElementById("reset-seen").addEventListener("click", () => {
  pageMenu.hidePopover();
  const count = seen.size;
  if (count === 0) return notify(el("p", { className: "note" }, "Nothing viewed yet"));

  const snapshot = { seen: [...seen], last: session.getItem(LAST) };
  seen.clear();
  session.setItem(SEEN, "[]");
  session.setItem(LAST, "");
  const undo = el("button", { type: "button" }, "Undo");
  undo.addEventListener("click", () => {
    snapshot.seen.forEach(k => seen.add(k));
    session.setItem(SEEN, JSON.stringify(snapshot.seen));
    session.setItem(LAST, snapshot.last ?? "");
    clearNote();
  });
  const label = count === 1 ? "Cleared 1 viewed · " : `Cleared ${fmt(count)} viewed · `;
  notify(el("p", { className: "note" }, label, undo));
});

// Stats. Counts are of the current list so they add up:
// restaurants = excluded + in rotation. "Seen" is this tab’s no-repeat progress.
const fmt = n => n.toLocaleString("en-US");
async function fillStats() {
  for (const id of ["stat-total", "stat-excluded", "stat-active", "stat-seen"])
    document.getElementById(id).textContent = "…";
  let list;
  try { list = await listPromise; } catch { return; }
  const active = list.filter(p => !isExcluded(p));
  document.getElementById("stat-total").textContent = fmt(list.length);
  document.getElementById("stat-excluded").textContent = fmt(list.length - active.length);
  document.getElementById("stat-active").textContent = fmt(active.length);
  document.getElementById("stat-seen").textContent = fmt(active.filter(p => seen.has(p.key)).length);
}

document.getElementById("show-stats").addEventListener("click", () => {
  pageMenu.hidePopover();
  statsDialog.showModal();
  fillStats();
});
document.getElementById("close-stats").addEventListener("click", () => statsDialog.close());
// A click on the backdrop lands on the <dialog> itself, outside its box.
statsDialog.addEventListener("click", e => {
  if (e.target !== statsDialog) return;
  const r = statsDialog.getBoundingClientRect();
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (!inside) statsDialog.close();
});
</script>
</body>
</html>
