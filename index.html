<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s Eat!</title>
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    color-scheme: dark;

    /* Design tokens */
    --page-color: #111111;
    --theme-color: #ff591f;
    --button-color: var(--theme-color);
    --card-color: #262626;
    --button-radius: 12px;
    --card-radius: var(--button-radius);
    --content-width: min(340px, calc(100vw - 32px)); /* button and card share this */
    --lift: 6vh; /* raises button and card above true center */

    /* Derived */
    --text-color: #eeeeee;
    --text-muted: #a3a3a3;
    --button-text-color: white;
    --menu-color: color-mix(in srgb, var(--card-color), white 10%);
  }

  html, body { margin: 0; height: 100%; background: var(--page-color); color: var(--text-color);
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { position: relative; height: 100%; }

  /* Button is pinned just above center (by --lift); the card hangs below it so the button never moves. */
  #eat { position: absolute; left: 50%; top: calc(50% - var(--lift)); transform: translate(-50%, -50%);
    width: var(--content-width); box-sizing: border-box;
    font: inherit; font-size: 22px; font-weight: 500; padding: 16px 20px; border: 0;
    border-radius: var(--button-radius); background: var(--button-color);
    color: var(--button-text-color); cursor: pointer; white-space: nowrap; }
  #eat:active { transform: translate(-50%, -50%) scale(0.97); }

  #result { position: absolute; left: 50%; top: calc(50% - var(--lift) + 52px); transform: translateX(-50%);
    width: var(--content-width); }

  /* The card is a container; its link stretches over the whole card (::after),
     and the kebab sits above that so it stays separately clickable. */
  .card { position: relative; padding: 32px 20px; border-radius: var(--card-radius);
    background: var(--card-color); color: var(--text-muted);
    text-align: center; line-height: 1.5; font-size: 15px; }
  .card:hover { background: color-mix(in srgb, var(--card-color), white 6%); }
  .card:has(.card-link:focus-visible) { outline: 2px solid var(--theme-color); outline-offset: 2px; }
  .card-link { color: inherit; text-decoration: none; outline: none; }
  .card-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .card .name { display: block; margin-bottom: 4px; color: var(--text-color);
    font-size: 20px; font-weight: 500; }

  /* Small icon buttons: the card’s ⋯, the page’s ⋮, the modal’s ×. */
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0;
    border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer; }
  .icon-btn:hover, .icon-btn:focus-visible { background: color-mix(in srgb, var(--card-color), white 12%);
    color: var(--text-color); outline: none; }
  .card .icon-btn { position: absolute; top: 4px; right: 4px; z-index: 1; }
  /* Page menu: fixed top-right, clear of the notch / home indicator when installed. */
  #page-kebab { position: fixed; z-index: 1; touch-action: manipulation;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }

  /* Native popovers; positioned under their trigger in JS when they open. */
  .menu { position: fixed; inset: auto; margin: 0; padding: 4px; border: 0;
    border-radius: var(--button-radius); background: var(--menu-color); color: var(--text-color);
    box-shadow: 0 8px 24px rgb(0 0 0 / 0.4); }
  .menu button { display: block; width: 100%; padding: 10px 14px; border: 0;
    border-radius: calc(var(--button-radius) - 4px); background: transparent;
    color: inherit; font: inherit; font-size: 15px; text-align: left; cursor: pointer; white-space: nowrap; }
  .menu button:enabled:hover, .menu button:focus-visible
    { background: color-mix(in srgb, var(--menu-color), white 8%); outline: none; }
  .menu button:disabled { color: var(--text-muted); opacity: 0.6; cursor: default; }
  .menu hr { margin: 4px 10px; border: 0; height: 1px; background: color-mix(in srgb, var(--menu-color), white 10%); }

  /* Stats modal: a native <dialog> (focus, Escape, screen readers) restyled to match the card. */
  #stats { width: var(--content-width); box-sizing: border-box; margin: auto; padding: 8px 20px 18px;
    border: 0; border-radius: var(--card-radius); background: var(--card-color); color: var(--text-color);
    font: inherit; box-shadow: 0 12px 32px rgb(0 0 0 / 0.3); }
  #stats::backdrop { background: rgb(0 0 0 / 0.45); }
  #stats[open], #stats[open]::backdrop { animation: fade-in 140ms ease-out; }
  @keyframes fade-in { from { opacity: 0; } }
  #stats header { display: flex; align-items: center; justify-content: space-between;
    margin: 0 -12px 6px 0; }
  #stats h2 { margin: 0; font-size: 17px; font-weight: 500; outline: none; }
  #stats dl { margin: 0; font-size: 15px; line-height: 1.5; }
  #stats .row { display: flex; gap: 10px; padding: 3px 0; }
  #stats dt { order: 2; color: var(--text-muted); }
  #stats dd { order: 1; margin: 0; min-width: 3.5em; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* Search: the field takes the button’s exact spot; suggestions or results hang below
     it in a panel that stops just short of the bottom of the window and scrolls. */
  #search { position: absolute; left: 50%; top: calc(50% - var(--lift)); transform: translate(-50%, -50%);
    width: var(--content-width); height: var(--control-height); box-sizing: border-box; display: flex; align-items: center; gap: 2px;
    padding: 0 8px 0 18px; border-radius: var(--button-radius); background: var(--card-color);
    box-shadow: inset 0 0 0 1.5px var(--theme-color); }
  #search[hidden] { display: none; }
  #search input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none;
    background: transparent; color: var(--text-color); font: inherit; font-size: 18px; }
  #search input::placeholder { color: var(--text-muted); }
  #search .icon-btn[hidden] { display: none; }

  /* --control-height is the button’s rendered height, set in JS when search opens. */
  #search-panel { --gap: 8px; position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(50% - var(--lift) + var(--control-height) / 2 + var(--gap));
    width: var(--content-width); max-height: calc(50% + var(--lift) - var(--control-height) / 2 - var(--gap) - 24px);
    overflow-y: auto; overscroll-behavior: contain; }
  /* Once scrolled, cards fade out under the top edge instead of being sliced off. */
  #search-panel.scrolled { mask-image: linear-gradient(to bottom, transparent, black 12px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 12px); }
  #search-panel:empty { display: none; }
  .suggestions { margin: 0; padding: 4px; list-style: none; border-radius: var(--button-radius);
    background: var(--menu-color); }
  .suggestions li { display: flex; gap: 12px; justify-content: space-between; padding: 10px 14px;
    border-radius: calc(var(--button-radius) - 4px); font-size: 15px; cursor: pointer; }
  .suggestions li[aria-selected="true"], .suggestions li:hover
    { background: color-mix(in srgb, var(--menu-color), white 8%); }
  .suggestions .count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .hits { display: grid; gap: 8px; }
  .hit { display: block; width: 100%; padding: 14px 16px; border: 0; border-radius: var(--card-radius);
    background: var(--card-color); color: var(--text-muted); font: inherit; font-size: 14px;
    line-height: 1.45; text-align: left; }
  button.hit { cursor: pointer; }
  button.hit:hover, button.hit:focus-visible { background: color-mix(in srgb, var(--card-color), white 6%); outline: none; }
  .hit .name { display: block; color: var(--text-color); font-size: 16px; font-weight: 500; }
  .hit .tag { margin-left: 6px; padding: 1px 6px; border-radius: 4px; vertical-align: 1px;
    background: color-mix(in srgb, var(--card-color), white 12%); color: var(--text-muted);
    font-size: 12px; font-weight: 500; }
  .hit .why { display: block; margin-top: 4px; color: var(--text-color); }
  .panel-note { margin: 0 0 8px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .hits + .panel-note { margin: 8px 0 0; }

  .note { margin: 12px 0 0; text-align: center; font-size: 13px; color: var(--text-muted); }
  .note button { padding: 0; border: 0; background: none; font: inherit;
    color: var(--text-color); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <button id="eat" type="button">Let’s Eat!</button>
  <div id="result" aria-live="polite"></div>
  <form id="search" role="search" hidden>
    <input id="search-input" type="text" placeholder="Search restaurants" aria-label="Search restaurants"
           role="combobox" aria-autocomplete="list" aria-controls="search-panel" aria-expanded="false"
           autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button type="button" class="icon-btn" id="search-clear" aria-label="Clear search" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="submit" class="icon-btn" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 5v6a4 4 0 0 1-4 4H5"/><path d="M9 10l-5 5 5 5"/></svg>
    </button>
  </form>
  <div id="search-panel" aria-live="polite"></div>
</main>

<button type="button" id="page-kebab" class="icon-btn" aria-label="Menu" popovertarget="page-menu">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
</button>
<div id="page-menu" class="menu" popover>
  <button type="button" id="show-stats">Show stats</button>
  <button type="button" id="reset-seen">Clear viewed</button>
  <button type="button" id="reset-excluded">Clear excluded</button>
  <!-- Debug tools: shown on Option-click or a long press of the menu button. -->
  <div id="debug-items" hidden>
    <hr>
    <button type="button" id="search-open">Search</button>
  </div>
</div>
<div id="card-menu" class="menu" popover>
  <button type="button" id="exclude">Exclude this entry</button>
</div>

<dialog id="stats" aria-labelledby="stats-title">
  <header>
    <h2 id="stats-title" tabindex="-1" autofocus>Stats</h2>
    <button type="button" class="icon-btn" id="close-stats" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <dl>
    <div class="row"><dt>restaurants</dt><dd id="stat-total">…</dd></div>
    <div class="row"><dt>excluded</dt><dd id="stat-excluded">…</dd></div>
    <div class="row"><dt>in rotation</dt><dd id="stat-active">…</dd></div>
    <div class="row"><dt>seen this session</dt><dd id="stat-seen">…</dd></div>
  </dl>
</dialog>

<script>
// Canonical list (see NOTES.md): open SF Business Registry locations, geocoded inside
// SF city limits, holding a DPH restaurant permit (H24/H25/H26).
const QUERY = "https://data.sf.gov/resource/g8m3-pdis.json?" + new URLSearchParams({
  $select: "ttxid,dba_name,full_business_address,lic,neighborhoods_analysis_boundaries",
  $where: "location_end_date IS NULL AND dba_end_date IS NULL" +
          " AND neighborhoods_analysis_boundaries IS NOT NULL" +
          " AND (lic like '%H24%' OR lic like '%H25%' OR lic like '%H26%')",
  $limit: "10000",
});

// Places that hold a restaurant permit but aren't somewhere the public goes to eat.
const MARKET_PERMIT = /\bH0[3-9]R?\b|\bH8[0-3]R?\b/;              // also a grocery/supermarket
const CONTRACT_CAFE = /@|\b(sodexo|aramark|guckenheimer|levy restaurants|events mgmt|employee|flik|culinart|eurest dining)\b/i;
const ADDRESS_AS_NAME = /^\d+\s.*\b(llc|inc|corp|corporation|lp|ltd)\b/i;

function cleanName(name) {
  let n = name.trim().replace(/\s+/g, " ");
  // "Boichik Bagels LLC" -> "Boichik Bagels" (repeat for "… Co., Inc.")
  const suffix = /[,\s]+(llc|l\.l\.c\.?|inc\.?|corp\.?|corporation|ltd\.?|lp)$/i;
  while (suffix.test(n)) n = n.replace(suffix, "");
  // "Ritz Carlton San Francisco The" -> "The Ritz Carlton San Francisco"
  if (/\sthe$/i.test(n)) n = "The " + n.replace(/\sthe$/i, "");
  return n;
}

// Display-only: registry names use straight quotes ("Ma's", "Grubbin'", '"Great American
// Music Hall"'). Convert them to curly punctuation. Maps search keeps the raw name.
function curly(s) {
  return s
    .replace(/`+$/, "")                                       // stray trailing backticks
    .replace(/(?<=[\p{L}\p{N}])["'`](?=[\p{L}\p{N}])/gu, "’") // Ma's, Mustafio"S
    .replace(/"([^"]*)"/g, "“$1”")                            // "quoted"
    .replace(/(^|[\s(])'(?=\d)/g, "$1’")                      // '90s
    .replace(/(^|[\s(])'/g, "$1‘")                            // opening single quote
    .replace(/['`]/g, "’")                                    // Grubbin', Gus'
    .replace(/"/g, "”");                                      // any unpaired leftover
}

// One entry per name + address. A few places are two registry rows; the entry
// keeps every row's location ID (ttxid) so excluding it covers all of them.
function buildList(rows) {
  const byKey = new Map();
  for (const r of rows) {
    const raw = r.dba_name || "";
    if (!raw || MARKET_PERMIT.test(r.lic || "") || CONTRACT_CAFE.test(raw) || ADDRESS_AS_NAME.test(raw)) continue;
    const name = cleanName(raw);
    const address = (r.full_business_address || "").trim().replace(/\s+/g, " ");
    const key = (name + "|" + address).toUpperCase().replace(/[^A-Z0-9|]/g, "");
    const existing = byKey.get(key);
    if (existing) { existing.ids.push(r.ttxid); continue; }
    byKey.set(key, { key, ids: [r.ttxid], name, address, hood: r.neighborhoods_analysis_boundaries });
  }
  return [...byKey.values()];
}

const listPromise = fetch(QUERY)
  .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
  .then(buildList);
listPromise.then(l => console.log(`Loaded ${l.length} restaurants`)).catch(() => {});

// Web storage, or an in-memory stand-in if it's unavailable (blocked, private
// mode, data: URL). Then: no repeats until reload; exclusions until reload.
function storage(kind) {
  try {
    const s = window[kind];
    s.setItem("_probe", "1");
    s.removeItem("_probe");
    return s;
  } catch {
    const m = new Map();
    return { getItem: k => m.get(k) ?? null, setItem: (k, v) => m.set(k, String(v)) };
  }
}

// No repeats until the tab closes: sessionStorage is per tab, survives reloads,
// and is cleared when the tab closes. Once every restaurant has been shown, the
// cycle restarts (skipping the one just shown so it can't appear twice in a row).
const session = storage("sessionStorage");
const SEEN = "seen", LAST = "last";
const seen = new Set(JSON.parse(session.getItem(SEEN) || "[]"));

// Exclusions are permanent on this device (localStorage), keyed by registry
// location ID. Name and address are kept so a future list can show them.
const local = storage("localStorage");
const EXCLUDED = "excluded";
const excluded = JSON.parse(local.getItem(EXCLUDED) || "{}");
const saveExcluded = () => local.setItem(EXCLUDED, JSON.stringify(excluded));
const isExcluded = p => p.ids.some(id => id in excluded);

function exclude(p) {
  const date = new Date().toLocaleDateString("en-CA"); // local YYYY-MM-DD
  for (const id of p.ids) excluded[id] = { name: p.name, address: p.address, date };
  saveExcluded();
}
function unexclude(p) {
  for (const id of p.ids) delete excluded[id];
  saveExcluded();
}
// Places, not IDs: a merged place has several IDs with the same name and address.
const excludedCount = () => new Set(Object.values(excluded).map(e => e.name + "|" + e.address)).size;
// Clears every exclusion; returns what was cleared so it can be restored.
function resetExcluded() {
  const snapshot = { ...excluded };
  for (const id in excluded) delete excluded[id];
  saveExcluded();
  return snapshot;
}
function restoreExcluded(snapshot) {
  Object.assign(excluded, snapshot);
  saveExcluded();
}

function pick(list) {
  const active = list.filter(p => !isExcluded(p));
  if (active.length === 0) return null;
  let pool = active.filter(p => !seen.has(p.key));
  if (pool.length === 0) {
    seen.clear();
    const last = session.getItem(LAST);
    pool = active.length > 1 ? active.filter(p => p.key !== last) : active;
  }
  const p = pool[Math.floor(Math.random() * pool.length)];
  seen.add(p.key);
  session.setItem(SEEN, JSON.stringify([...seen]));
  session.setItem(LAST, p.key);
  return p;
}

const btn = document.getElementById("eat");
const out = document.getElementById("result");
const cardMenu = document.getElementById("card-menu");
const pageMenu = document.getElementById("page-menu");
const statsDialog = document.getElementById("stats");
let current = null;

const el = (tag, props = {}, ...children) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...children);
  return e;
};

const ICON_MORE_H = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
  '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

function showMessage(text) {
  current = null;
  out.replaceChildren(el("div", { className: "card" }, text));
}

// Render a restaurant card, optionally with a note (and its Undo) below it.
function show(p, note) {
  current = p;
  const link = el("a", {
    className: "card-link",
    href: "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(`${p.name}, ${p.address}, San Francisco, CA`),
    target: "_blank",
    rel: "noopener",
  }, el("span", { className: "name" }, curly(p.name)), p.address, el("br"), p.hood || "");

  const more = el("button", { type: "button", className: "icon-btn", innerHTML: ICON_MORE_H });
  more.setAttribute("aria-label", "Entry options");
  more.setAttribute("popovertarget", "card-menu");

  out.replaceChildren(el("div", { className: "card" }, link, more), ...(note ? [note] : []));
}

// Show a note under the card, or on its own if no card is showing.
function notify(note) {
  if (current) show(current, note);
  else out.replaceChildren(note);
}
// Put back whatever was showing before a note appeared.
function clearNote() {
  if (current) show(current);
  else out.replaceChildren();
}

async function next() {
  let list;
  try {
    list = await listPromise;
  } catch {
    return showMessage("Couldn’t load restaurants. Reload to try again.");
  }
  const p = pick(list);
  if (!p) return showMessage("Every restaurant is excluded.");
  show(p);
  return p;
}

btn.addEventListener("click", next);

// Menus open under their trigger, right-aligned to it.
function anchorMenu(menu, trigger) {
  menu.addEventListener("toggle", e => {
    if (e.newState !== "open") return;
    const t = trigger().getBoundingClientRect();
    menu.style.top = `${t.bottom + 8}px`;
    menu.style.left = `${t.right - menu.offsetWidth}px`;
  });
}
anchorMenu(cardMenu, () => out.querySelector(".card .icon-btn"));
const kebab = document.getElementById("page-kebab");
anchorMenu(pageMenu, () => kebab);

// A plain click shows the usual items; Option-click or a long press adds the
// debug tools. The button keeps popovertarget so the browser treats it as part
// of the menu (releasing a long press over it doesn’t count as a click outside,
// which would close the menu), but its click is cancelled so this code decides
// what opens.
const LONG_PRESS_MS = 500;
const debugItems = document.getElementById("debug-items");
let pressTimer = null, longPressed = false;
function openPageMenu(debug) {
  debugItems.hidden = !debug;
  pageMenu.showPopover();
}
kebab.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  longPressed = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    longPressed = true;
    if (pageMenu.matches(":popover-open")) pageMenu.hidePopover();
    openPageMenu(true);
  }, LONG_PRESS_MS);
});
for (const type of ["pointerup", "pointerleave", "pointercancel"])
  kebab.addEventListener(type, () => clearTimeout(pressTimer));
kebab.addEventListener("contextmenu", e => e.preventDefault()); // touch long press
kebab.addEventListener("click", e => {
  e.preventDefault(); // skip the built-in toggle
  if (longPressed) { longPressed = false; return; } // the long press already opened it
  if (pageMenu.matches(":popover-open")) pageMenu.hidePopover();
  else openPageMenu(e.altKey);
});

// Clicking blank space hides the card. If a menu was open, that click only
// closes the menu (popovers dismiss themselves), so remember its state first.
// The page menu, its trigger, and the modal live outside <main>, so their
// clicks never reach this handler.
let menuWasOpen = false;
document.addEventListener("pointerdown", () => {
  menuWasOpen = cardMenu.matches(":popover-open") || pageMenu.matches(":popover-open");
}, true);
document.querySelector("main").addEventListener("click", e => {
  if (menuWasOpen) return;
  // Use the path captured at dispatch: an Undo re-renders the card, and picking
  // a search result closes the panel, both detaching the clicked node first.
  const path = e.composedPath();
  if (path.some(n => n === searchForm || n === searchPanel)) return;
  if (searching()) return closeSearch();
  if (path.some(n => n === btn || n === out)) return;
  current = null;
  out.replaceChildren();
});

document.getElementById("exclude").addEventListener("click", async () => {
  cardMenu.hidePopover();
  const gone = current;
  if (!gone) return;
  exclude(gone);
  const p = await next();
  if (!p) return;

  const undo = el("button", { type: "button" }, "Undo");
  undo.addEventListener("click", () => {
    unexclude(gone);
    show(gone);
  });
  show(p, el("p", { className: "note" }, `Excluded ${curly(gone.name)} · `, undo));
});

document.getElementById("reset-excluded").addEventListener("click", () => {
  pageMenu.hidePopover();
  const count = excludedCount();
  const snapshot = resetExcluded();
  const undo = el("button", { type: "button" }, "Undo");
  undo.addEventListener("click", () => {
    restoreExcluded(snapshot);
    clearNote();
  });
  const label = count === 1 ? "Cleared 1 exclusion · " : `Cleared ${fmt(count)} exclusions · `;
  notify(el("p", { className: "note" }, label, undo));
});

// Restart the no-repeat shuffle from zero: everything is eligible again.
document.getElementById("reset-seen").addEventListener("click", () => {
  pageMenu.hidePopover();
  const count = seen.size;
  const snapshot = { seen: [...seen], last: session.getItem(LAST) };
  seen.clear();
  session.setItem(SEEN, "[]");
  session.setItem(LAST, "");
  const undo = el("button", { type: "button" }, "Undo");
  undo.addEventListener("click", () => {
    snapshot.seen.forEach(k => seen.add(k));
    session.setItem(SEEN, JSON.stringify(snapshot.seen));
    session.setItem(LAST, snapshot.last ?? "");
    clearNote();
  });
  const label = count === 1 ? "Cleared 1 viewed · " : `Cleared ${fmt(count)} viewed · `;
  notify(el("p", { className: "note" }, label, undo));
});

// The Clear items show how much they’d clear, and are disabled when there’s
// nothing to clear. Set on open, so they always reflect the current state.
const resetSeenItem = document.getElementById("reset-seen");
const resetExcludedItem = document.getElementById("reset-excluded");
function labelClear(item, text, count) {
  item.textContent = count ? `${text} (${fmt(count)})` : text;
  item.disabled = count === 0;
}
pageMenu.addEventListener("beforetoggle", e => {
  if (e.newState !== "open") return;
  labelClear(resetSeenItem, "Clear viewed", seen.size);
  labelClear(resetExcludedItem, "Clear excluded", excludedCount());
});

// Stats. Counts are of the current list so they add up:
// restaurants = excluded + in rotation. "Seen" is this tab’s no-repeat progress.
const fmt = n => n.toLocaleString("en-US");
async function fillStats() {
  for (const id of ["stat-total", "stat-excluded", "stat-active", "stat-seen"])
    document.getElementById(id).textContent = "…";
  let list;
  try { list = await listPromise; } catch { return; }
  const active = list.filter(p => !isExcluded(p));
  document.getElementById("stat-total").textContent = fmt(list.length);
  document.getElementById("stat-excluded").textContent = fmt(list.length - active.length);
  document.getElementById("stat-active").textContent = fmt(active.length);
  document.getElementById("stat-seen").textContent = fmt(active.filter(p => seen.has(p.key)).length);
}

document.getElementById("show-stats").addEventListener("click", () => {
  pageMenu.hidePopover();
  statsDialog.showModal();
  fillStats();
});
document.getElementById("close-stats").addEventListener("click", () => statsDialog.close());
// A click on the backdrop lands on the <dialog> itself, outside its box.
statsDialog.addEventListener("click", e => {
  if (e.target !== statsDialog) return;
  const r = statsDialog.getBoundingClientRect();
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (!inside) statsDialog.close();
});

// ── Search ─────────────────────────────────────────────────────────────────
// A sanity check on the list: is a place I know about on it? Typing shows compact
// suggestions; Enter shows every match as a card. With no match, the full city
// registry is checked live to say why the place didn’t make the list.

const searchForm = document.getElementById("search");
const searchInput = document.getElementById("search-input");
const searchClear = document.getElementById("search-clear");
const searchPanel = document.getElementById("search-panel");
const searching = () => !searchForm.hidden;
const main = document.querySelector("main");
searchPanel.addEventListener("scroll", () => searchPanel.classList.toggle("scrolled", searchPanel.scrollTop > 0));

// Lowercase, no accents or apostrophes, other punctuation as spaces:
// "Mel’s Café" → "mels cafe".
const norm = s => s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase()
  .replace(/['’‘`]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

// Edit distance, giving up once it exceeds max.
function within(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return false;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++)
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (Math.min(...row) > max) return false;
    prev = row;
  }
  return prev[b.length] <= max;
}
// A query word matches a name word if it starts it, allowing a typo once it’s
// long enough to mean something (1 from 4 letters, 2 from 7).
function fuzzyWord(q, words) {
  const max = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0;
  // Compare against the word’s opening at a few lengths, so a dropped or added
  // letter (“tartne”) still lines up with “tartine”.
  return words.some(w => w.startsWith(q) || (max > 0 &&
    Array.from({ length: 2 * max + 1 }, (_, i) => q.length - max + i)
      .some(len => len > 0 && len <= w.length && within(q, w.slice(0, len), max))));
}

// Lower is better; null means no match.
function score(entry, q, qWords) {
  if (entry.normName.startsWith(q)) return 0;
  if (qWords.every(t => entry.nameWords.some(w => w.startsWith(t)))) return 1;
  if (entry.normName.includes(q)) return 2;
  if (entry.normAddr.startsWith(q) || entry.normAddr.includes(" " + q)) return 3;
  if (qWords.every(t => fuzzyWord(t, entry.nameWords))) return 4;
  return null;
}

const byName = (a, b) => a.localeCompare(b, "en", { numeric: true, sensitivity: "base" });
let indexed = null;
async function searchIndex() {
  if (indexed) return indexed;
  const list = await listPromise;
  return indexed = list.map(p => {
    const normName = norm(p.name);
    return { p, normName, nameWords: normName.split(" "), normAddr: norm(p.address) };
  });
}
async function matches(query) {
  const q = norm(query);
  if (!q) return [];
  const qWords = q.split(" ");
  let hits = [];
  for (const e of await searchIndex()) {
    const s = score(e, q, qWords);
    if (s !== null) hits.push({ p: e.p, s });
  }
  // Typo matches only when nothing matches as typed: otherwise “tartine”
  // would bring along Kantine and Golden Sardine.
  if (hits.some(h => h.s < 4)) hits = hits.filter(h => h.s < 4);
  return hits.sort((a, b) => a.s - b.s || byName(a.p.name, b.p.name)); // [{ p, s }]
}

// Chains share a name apart from a store number ("Starbucks Coffee #6605"), so
// suggestions group them as one family with a count. Once the field holds a
// family’s name exactly, that family opens up into its individual names.
// Within a match tier, bigger groups come first: “sta” leads with Starbucks.
const family = name => name.replace(/\s*#\s*\d+\s*$/, "");
function suggestionsFor(query, hits) {
  const q = norm(query);
  const groups = new Map();
  for (const { p, s } of hits) {
    const label = norm(family(p.name)) === q ? p.name : family(p.name);
    const g = groups.get(label) || groups.set(label, { label, count: 0, s, hits: [] }).get(label);
    g.count++;
    g.hits.push({ p, s });
  }
  return [...groups.values()]
    .sort((a, b) => a.s - b.s || b.count - a.count || byName(a.label, b.label))
    .slice(0, 8);
}

let suggestions = [];
let active = -1;   // highlighted suggestion, or -1
let searchRun = 0; // drops results from a superseded keystroke or query

function renderSuggestions() {
  if (!suggestions.length) {
    searchInput.setAttribute("aria-expanded", "false");
    searchInput.removeAttribute("aria-activedescendant");
    return searchPanel.replaceChildren();
  }
  const ul = el("ul", { className: "suggestions", role: "listbox" });
  suggestions.forEach((sg, i) => {
    const li = el("li", { id: `sg-${i}`, role: "option" }, el("span", {}, curly(sg.label)));
    if (sg.count > 1) li.append(el("span", { className: "count" }, fmt(sg.count)));
    li.setAttribute("aria-selected", String(i === active));
    li.addEventListener("pointerdown", e => e.preventDefault()); // keep focus in the field
    li.addEventListener("click", () => accept(sg));
    ul.append(li);
  });
  searchPanel.replaceChildren(ul);
  searchInput.setAttribute("aria-expanded", "true");
  if (active >= 0) searchInput.setAttribute("aria-activedescendant", `sg-${active}`);
  else searchInput.removeAttribute("aria-activedescendant");
}

async function updateSuggestions() {
  const run = ++searchRun;
  const query = searchInput.value;
  searchClear.hidden = !query;
  let hits = [];
  try { hits = await matches(query); } catch {}
  if (run !== searchRun) return;
  suggestions = suggestionsFor(query, hits);
  // A lone suggestion that just repeats the field adds nothing.
  if (suggestions.length === 1 && suggestions[0].count === 1 && norm(suggestions[0].label) === norm(query))
    suggestions = [];
  active = -1;
  renderSuggestions();
}

// Put a suggestion in the field and narrow from there.
// A chain opens up into its stores; a single place (or a group the field
// already names, so there’s nothing left to narrow) goes straight to its card.
function accept(sg) {
  const narrowed = norm(sg.label) === norm(searchInput.value);
  searchInput.value = sg.label;
  searchInput.focus();
  if (sg.count === 1 || narrowed) showResults(sg.label, sg.hits);
  else updateSuggestions();
}

const RESULT_CAP = 100;
// Every match for the query, or just the places in an accepted suggestion.
async function showResults(query, chosen) {
  const run = ++searchRun;
  suggestions = [];
  renderSuggestions();
  if (!norm(query)) return;
  let hits;
  try { hits = chosen || await matches(query); }
  catch { return searchPanel.replaceChildren(el("p", { className: "panel-note" }, "Couldn’t load restaurants.")); }
  if (run !== searchRun) return;
  if (!hits.length) return diagnose(query, run);

  const cards = hits.slice(0, RESULT_CAP).map(({ p }) => {
    const name = el("span", { className: "name" }, curly(p.name));
    if (isExcluded(p)) name.append(el("span", { className: "tag" }, "Excluded"));
    const card = el("button", { type: "button", className: "hit" }, name, p.address, el("br"), p.hood || "");
    card.addEventListener("click", () => { closeSearch(); show(p); });
    return card;
  });
  const count = hits.length === 1 ? "1 match" : `${fmt(hits.length)} matches`;
  searchPanel.replaceChildren(
    el("p", { className: "panel-note" }, count),
    el("div", { className: "hits" }, ...cards),
    ...(hits.length > RESULT_CAP
      ? [el("p", { className: "panel-note" }, `Showing the first ${RESULT_CAP}. Keep typing to narrow it down.`)]
      : []));
  searchPanel.scrollTop = 0;
  searchPanel.classList.remove("scrolled");
}

// ── Not on the list: ask the full registry why ──────────────────────────────

// DPH permit codes that explain why a place isn’t on a restaurants-only list.
const PERMITS = [
  [/^H0[3-9]$|^H8[0-3]$/, "market"], [/^H28$/, "take-out"], [/^H29$/, "fast food"],
  [/^H86$/, "bar, no food"], [/^H87$/, "bar with food"], [/^H88$/, "bakery"],
  [/^H30$|^H74$|^J07$/, "caterer"], [/^H8[45]$/, "employee cafeteria"],
  [/^H9[01]$/, "school cafeteria"], [/^H36$/, "stadium concession"],
];
const permitLabel = code => (PERMITS.find(([re]) => re.test(code)) || [, null])[1];
const monthYear = d => new Date(d).toLocaleDateString("en-US", { month: "short", year: "numeric" });

function whyMissing(r) {
  const end = r.location_end_date || r.dba_end_date;
  if (end) return `Closed ${monthYear(end)}`;
  if (!r.neighborhoods_analysis_boundaries) return "Not geocoded inside SF";
  // Health permits are the H/J codes; an R suffix is a renewal of the same permit.
  const codes = [...new Set((r.lic || "").split(/\s+/).filter(c => /^[HJ]\d/.test(c)).map(c => c.replace(/R$/, "")))];
  if (!codes.some(c => /^H2[456]$/.test(c))) {
    if (!codes.length) return "No food permit on file";
    return "Permit " + codes.map(c => permitLabel(c) ? `${c} (${permitLabel(c)})` : c).join(", ") +
      ", not a restaurant permit";
  }
  if (MARKET_PERMIT.test(r.lic)) return "Also holds a market permit, filtered out";
  if (CONTRACT_CAFE.test(r.dba_name)) return "Looks like a contract café, filtered out";
  if (ADDRESS_AS_NAME.test(r.dba_name)) return "Name is an address, filtered out";
  return "Should be on the list. Search missed it.";
}

async function diagnose(query, run) {
  const notOnList = el("p", { className: "panel-note" }, "Not on the list. Checking the city registry…");
  searchPanel.replaceChildren(notOnList);
  // Every word must appear in the name. Dropping a final s means “mels” still
  // finds MEL’S, since the registry can’t ignore apostrophes the way we do.
  const words = norm(query).split(" ").filter(w => w.length >= 2).map(w => w.length > 3 ? w.replace(/s$/, "") : w);
  if (!words.length) return (notOnList.textContent = "Not on the list, or in the city registry.");
  const url = "https://data.sf.gov/resource/g8m3-pdis.json?" + new URLSearchParams({
    $select: "dba_name,full_business_address,lic,location_end_date,dba_end_date,neighborhoods_analysis_boundaries",
    $where: words.map(w => `upper(dba_name) like '%${w.toUpperCase()}%'`).join(" AND "),
    $limit: "200",
  });
  let rows;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    rows = await res.json();
  } catch {
    if (run === searchRun) notOnList.textContent = "Not on the list. Couldn’t reach the city registry.";
    return;
  }
  if (run !== searchRun) return;
  if (!rows.length) return (notOnList.textContent = "Not on the list, or in the city registry.");

  // One row per name + address, open locations first, then the most recently closed.
  const end = r => r.location_end_date || r.dba_end_date || "9999";
  const seenKeys = new Set();
  const unique = rows.sort((a, b) => end(b).localeCompare(end(a))).filter(r => {
    const k = norm((r.dba_name || "") + "|" + (r.full_business_address || ""));
    return !seenKeys.has(k) && seenKeys.add(k);
  });
  const shown = unique.slice(0, 5).map(r => el("div", { className: "hit" },
    el("span", { className: "name" }, curly(cleanName(r.dba_name || ""))),
    (r.full_business_address || "").trim(), r.neighborhoods_analysis_boundaries ? ", " + r.neighborhoods_analysis_boundaries : "",
    el("span", { className: "why" }, whyMissing(r))));
  notOnList.textContent = "Not on the list. In the city registry:";
  searchPanel.replaceChildren(notOnList, el("div", { className: "hits" }, ...shown),
    ...(unique.length > 5 ? [el("p", { className: "panel-note" }, `And ${fmt(unique.length - 5)} more. Add words to narrow it down.`)] : []));
}

// ── Opening, closing, keys ─────────────────────────────────────────────────

function openSearch() {
  if (!searching()) {
    main.style.setProperty("--control-height", `${btn.offsetHeight}px`); // same footprint as the button
    btn.hidden = out.hidden = true;
    searchForm.hidden = false;
  }
  searchInput.focus();
  searchInput.select();
}
function closeSearch() {
  if (!searching()) return;
  ++searchRun;
  searchForm.hidden = true;
  btn.hidden = out.hidden = false;
  searchInput.value = "";
  searchClear.hidden = true;
  suggestions = [];
  renderSuggestions();
}

document.getElementById("search-open").addEventListener("click", () => {
  pageMenu.hidePopover();
  openSearch();
});
// Any other page-menu item closes the search.
pageMenu.addEventListener("click", e => {
  const item = e.target.closest("button");
  if (item && item.id !== "search-open") closeSearch();
});

searchInput.addEventListener("input", updateSuggestions);
searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchInput.focus();
  updateSuggestions();
});
searchForm.addEventListener("submit", e => {
  e.preventDefault();
  // Enter on a highlighted suggestion shows that suggestion’s places.
  const sg = active >= 0 ? suggestions[active] : null;
  if (sg) searchInput.value = sg.label;
  showResults(searchInput.value, sg?.hits);
});
searchInput.addEventListener("keydown", e => {
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && suggestions.length) {
    e.preventDefault();
    const n = suggestions.length;
    active = e.key === "ArrowDown" ? (active + 1) % n : (active <= 0 ? n : active) - 1;
    renderSuggestions();
  } else if (e.key === "Tab" && !e.shiftKey && suggestions.length) {
    e.preventDefault();
    accept(suggestions[Math.max(active, 0)]);
  }
});
// Escape closes the search, unless it’s closing a menu that’s open over it.
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || !searching()) return;
  if (pageMenu.matches(":popover-open") || cardMenu.matches(":popover-open")) return;
  closeSearch();
}, true);
</script>
