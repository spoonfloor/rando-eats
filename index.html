<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let’s Eat!</title>
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    color-scheme: dark;

    /* Design tokens */
    --page-color: #111111;
    --theme-color: #eeeeee;
    --button-color: var(--theme-color);
    --card-color: #262626;
    --button-radius: 16px;
    --card-radius: var(--button-radius);

    /* Derived */
    --text-color: #eeeeee;
    --text-muted: #a3a3a3;
    --button-text-color: var(--page-color);
  }

  html, body { margin: 0; height: 100%; background: var(--page-color); color: var(--text-color);
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { position: relative; height: 100%; }

  /* Button is pinned to the exact center; the card hangs below it so the button never moves. */
  #eat { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: inherit; font-size: 22px; font-weight: 500; padding: 16px 36px; border: 0;
    border-radius: var(--button-radius); background: var(--button-color);
    color: var(--button-text-color); cursor: pointer; white-space: nowrap; }
  #eat:active { transform: translate(-50%, -50%) scale(0.97); }

  #result { position: absolute; left: 50%; top: calc(50% + 52px); transform: translateX(-50%);
    width: min(340px, calc(100% - 32px)); }
  .card { display: block; padding: 18px 20px; border-radius: var(--card-radius);
    background: var(--card-color); color: var(--text-muted); text-decoration: none;
    text-align: center; line-height: 1.5; font-size: 15px; }
  .card:hover { background: color-mix(in srgb, var(--card-color), white 6%); }
  .card:focus-visible { outline: 2px solid var(--theme-color); outline-offset: 2px; }
  .card .name { display: block; margin-bottom: 4px; color: var(--text-color);
    font-size: 20px; font-weight: 500; }
</style>
</head>
<body>
<main>
  <button id="eat" type="button">Let’s Eat!</button>
  <div id="result" aria-live="polite"></div>
</main>

<script>
// Canonical list (see NOTES.md): open SF Business Registry locations, geocoded inside
// SF city limits, holding a DPH restaurant permit (H24/H25/H26).
const QUERY = "https://data.sf.gov/resource/g8m3-pdis.json?" + new URLSearchParams({
  $select: "dba_name,full_business_address,lic,neighborhoods_analysis_boundaries",
  $where: "location_end_date IS NULL AND dba_end_date IS NULL" +
          " AND neighborhoods_analysis_boundaries IS NOT NULL" +
          " AND (lic like '%H24%' OR lic like '%H25%' OR lic like '%H26%')",
  $limit: "10000",
});

// Places that hold a restaurant permit but aren't somewhere the public goes to eat.
const MARKET_PERMIT = /\bH0[3-9]R?\b|\bH8[0-3]R?\b/;              // also a grocery/supermarket
const CONTRACT_CAFE = /@|\b(sodexo|aramark|guckenheimer|levy restaurants|events mgmt|employee)\b/i;
const ADDRESS_AS_NAME = /^\d+\s.*\b(llc|inc|corp|corporation|lp|ltd)\b/i;

function cleanName(name) {
  let n = name.trim().replace(/\s+/g, " ");
  // "Boichik Bagels LLC" -> "Boichik Bagels" (repeat for "… Co., Inc.")
  const suffix = /[,\s]+(llc|l\.l\.c\.?|inc\.?|corp\.?|corporation|ltd\.?|lp)$/i;
  while (suffix.test(n)) n = n.replace(suffix, "");
  // "Ritz Carlton San Francisco The" -> "The Ritz Carlton San Francisco"
  if (/\sthe$/i.test(n)) n = "The " + n.replace(/\sthe$/i, "");
  return n;
}

function buildList(rows) {
  const seen = new Set();
  const list = [];
  for (const r of rows) {
    const raw = r.dba_name || "";
    if (!raw || MARKET_PERMIT.test(r.lic || "") || CONTRACT_CAFE.test(raw) || ADDRESS_AS_NAME.test(raw)) continue;
    const name = cleanName(raw);
    const address = (r.full_business_address || "").trim().replace(/\s+/g, " ");
    const key = (name + "|" + address).toUpperCase().replace(/[^A-Z0-9|]/g, "");
    if (seen.has(key)) continue;
    seen.add(key);
    list.push({ key, name, address, hood: r.neighborhoods_analysis_boundaries });
  }
  return list;
}

const listPromise = fetch(QUERY)
  .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
  .then(buildList);
listPromise.then(l => console.log(`Loaded ${l.length} restaurants`)).catch(() => {});

// No repeats until the tab closes: sessionStorage is per tab, survives reloads,
// and is cleared when the tab closes. Once every restaurant has been shown, the
// cycle restarts (skipping the one just shown so it can't appear twice in a row).
// If storage is unavailable (blocked, private mode, data: URL), fall back to an
// in-memory store: no repeats until reload instead of until the tab closes.
const store = (() => {
  try {
    sessionStorage.setItem("_probe", "1");
    sessionStorage.removeItem("_probe");
    return sessionStorage;
  } catch {
    const m = new Map();
    return { getItem: k => m.get(k) ?? null, setItem: (k, v) => m.set(k, String(v)) };
  }
})();
const SEEN = "seen", LAST = "last";
const seen = new Set(JSON.parse(store.getItem(SEEN) || "[]"));

function pick(list) {
  let pool = list.filter(p => !seen.has(p.key));
  if (pool.length === 0) {
    seen.clear();
    const last = store.getItem(LAST);
    pool = list.length > 1 ? list.filter(p => p.key !== last) : list;
  }
  const p = pool[Math.floor(Math.random() * pool.length)];
  seen.add(p.key);
  store.setItem(SEEN, JSON.stringify([...seen]));
  store.setItem(LAST, p.key);
  return p;
}

const btn = document.getElementById("eat");
const out = document.getElementById("result");

btn.addEventListener("click", async () => {
  let list;
  try {
    list = await listPromise;
  } catch {
    const msg = document.createElement("div");
    msg.className = "card";
    msg.textContent = "Couldn’t load restaurants. Reload to try again.";
    out.replaceChildren(msg);
    return;
  }
  const p = pick(list);

  // The whole card is the link to the map.
  const card = document.createElement("a");
  card.className = "card";
  card.href = "https://www.google.com/maps/search/?api=1&query=" +
              encodeURIComponent(`${p.name}, ${p.address}, San Francisco, CA`);
  card.target = "_blank";
  card.rel = "noopener";
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = p.name;
  card.replaceChildren(name, p.address, document.createElement("br"), p.hood || "");
  out.replaceChildren(card);
});
</script>
</body>
</html>
